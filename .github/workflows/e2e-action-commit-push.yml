name: (E2E) Action Commit Push

on:
  workflow_call:
    inputs:
      mode:
        description: Execution mode (ref or image)
        required: false
        type: string
        default: ref
      image_tag:
        description: Image tag for docker mode (for example v1.2.3-test or v1.2.3-rc)
        required: false
        type: string
        default: v1
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (ref or image)
        required: false
        default: ref
        type: choice
        options:
          - ref
          - image
      image_tag:
        description: Image tag for docker mode (for example v1.2.3-test or v1.2.3-rc)
        required: false
        default: v1
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Validate workflow inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate mode input
        run: |
          case "${{ inputs.mode }}" in
            ref|image) ;;
            *)
              echo "Unsupported mode '${{ inputs.mode }}'. Expected 'ref' or 'image'."
              exit 1
              ;;
          esac

      - name: Enforce organization caller for reusable workflow
        if: ${{ github.event_name == 'workflow_call' }}
        run: |
          if [ "${{ github.repository_owner }}" != "devops-infra" ]; then
            echo "This reusable workflow can only be called by devops-infra repositories."
            exit 1
          fi

  basic-commit:
    name: Basic commit and push to new branch
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create test file
        run: echo "E2E basic commit test $(date -u)" > e2e-test-file.md

      - name: Commit and push to new branch
        if: ${{ inputs.mode == 'ref' }}
        id: commit
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "test(commit-push): basic commit test"
          target_branch: test/e2e-commit-push-basic-${{ github.run_id }}

      - name: Commit and push via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify outputs
        if: ${{ inputs.mode == 'ref' }}
        run: |
          echo "branch_name=${{ steps.commit.outputs.branch_name }}"
          echo "files_changed=${{ steps.commit.outputs.files_changed }}"
          test -n "${{ steps.commit.outputs.branch_name }}"
          test -n "${{ steps.commit.outputs.files_changed }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-basic-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  commit-with-prefix-message:
    name: Commit with custom prefix and message
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create test file
        run: echo "E2E prefix message test $(date -u)" > e2e-prefix-test.md

      - name: Commit with custom prefix and message
        if: ${{ inputs.mode == 'ref' }}
        id: commit
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_prefix: "test(commit-push): "
          commit_message: "custom message test"
          target_branch: test/e2e-commit-push-prefix-${{ github.run_id }}

      - name: Commit via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify outputs
        if: ${{ inputs.mode == 'ref' }}
        run: |
          echo "branch_name=${{ steps.commit.outputs.branch_name }}"
          echo "files_changed=${{ steps.commit.outputs.files_changed }}"
          test -n "${{ steps.commit.outputs.branch_name }}"
          test -n "${{ steps.commit.outputs.files_changed }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-prefix-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  allow-empty-commit:
    name: Allow empty commit with no file changes
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Commit with no file changes to new branch
        if: ${{ inputs.mode == 'ref' }}
        id: commit
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_empty_commit: "true"
          commit_message: "test(commit-push): empty commit test"
          target_branch: test/e2e-commit-push-empty-${{ github.run_id }}

      - name: Empty commit via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify branch output
        if: ${{ inputs.mode == 'ref' }}
        run: |
          echo "branch_name=${{ steps.commit.outputs.branch_name }}"
          test -n "${{ steps.commit.outputs.branch_name }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-empty-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  commit-with-timestamp-branch:
    name: Commit to timestamped branch name
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create test file
        run: echo "E2E timestamp branch test $(date -u)" > e2e-timestamp-test.md

      - name: Commit and push to timestamped branch
        if: ${{ inputs.mode == 'ref' }}
        id: commit
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_timestamp: "true"
          commit_message: "test(commit-push): timestamp branch test"
          target_branch: test/e2e-commit-push-timestamp

      - name: Commit via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify timestamped branch output
        if: ${{ inputs.mode == 'ref' }}
        run: |
          branch_name="${{ steps.commit.outputs.branch_name }}"
          echo "branch_name=${branch_name}"
          [[ "${branch_name}" =~ ^test/e2e-commit-push-timestamp-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch_name="${{ steps.commit.outputs.branch_name }}"
          if [ -n "${branch_name}" ] && git ls-remote --exit-code --heads origin "${branch_name}" >/dev/null 2>&1; then
            git push origin --delete "${branch_name}"
          fi

  commit-with-repository-path:
    name: Commit from custom repository_path
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository into custom path
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: repo

      - name: Create test file in custom path
        run: echo "E2E repository path test $(date -u)" > repo/e2e-repository-path.md

      - name: Commit and push using repository_path
        if: ${{ inputs.mode == 'ref' }}
        id: commit
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository_path: repo
          commit_message: "test(commit-push): repository path test"
          target_branch: test/e2e-commit-push-path-${{ github.run_id }}

      - name: Commit via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify repository_path output
        if: ${{ inputs.mode == 'ref' }}
        run: |
          echo "files_changed=${{ steps.commit.outputs.files_changed }}"
          test -n "${{ steps.commit.outputs.branch_name }}"
          grep -Fq "e2e-repository-path.md" <<'EOF'
          ${{ steps.commit.outputs.files_changed }}
          EOF

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          cd repo
          branch="test/e2e-commit-push-path-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  reset-target-branch-to-base:
    name: Reset target branch to base branch
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare base and target branches
        if: ${{ inputs.mode == 'ref' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          base_branch="test/e2e-commit-push-base-${{ github.run_id }}"
          target_branch="test/e2e-commit-push-reset-${{ github.run_id }}"

          git checkout -b "${base_branch}"
          echo "base" > e2e-reset-base.md
          git add e2e-reset-base.md
          git commit -m "test(commit-push): base branch for reset"
          git push origin "${base_branch}"

          git checkout -b "${target_branch}" "${base_branch}"
          echo "legacy" > e2e-reset-legacy.md
          git add e2e-reset-legacy.md
          git commit -m "test(commit-push): legacy target branch content"
          git push origin "${target_branch}"

      - name: Reset target branch using action
        if: ${{ inputs.mode == 'ref' }}
        id: reset
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: test/e2e-commit-push-reset-${{ github.run_id }}
          base_branch: test/e2e-commit-push-base-${{ github.run_id }}
          reset_target_branch: "true"
          force_with_lease: "true"

      - name: Reset via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify branch reset effect
        if: ${{ inputs.mode == 'ref' }}
        run: |
          test -n "${{ steps.reset.outputs.branch_name }}"
          git fetch origin test/e2e-commit-push-reset-${{ github.run_id }}
          git show origin/test/e2e-commit-push-reset-${{ github.run_id }}:e2e-reset-base.md >/dev/null
          if git show origin/test/e2e-commit-push-reset-${{ github.run_id }}:e2e-reset-legacy.md >/dev/null 2>&1; then
            echo "Expected legacy file to be removed after reset_target_branch=true"
            exit 1
          fi

      - name: Cleanup - delete test branches
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          for branch in \
            test/e2e-commit-push-reset-${{ github.run_id }} \
            test/e2e-commit-push-base-${{ github.run_id }}
          do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

  rebase-conflict-fails-when-strict:
    name: Rebase conflict fails when fail_on_rebase_conflict=true
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare conflicting branches
        if: ${{ inputs.mode == 'ref' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          base_branch="test/e2e-commit-push-conflict-base-${{ github.run_id }}"
          target_branch="test/e2e-commit-push-conflict-target-${{ github.run_id }}"

          git checkout -b "${base_branch}"
          printf 'value=one\n' > e2e-rebase-conflict.md
          git add e2e-rebase-conflict.md
          git commit -m "test(commit-push): base commit"
          git push origin "${base_branch}"

          git checkout -b "${target_branch}" "${base_branch}"
          printf 'value=target\n' > e2e-rebase-conflict.md
          git add e2e-rebase-conflict.md
          git commit -m "test(commit-push): target diverges"
          git push origin "${target_branch}"

          git checkout "${base_branch}"
          printf 'value=base\n' > e2e-rebase-conflict.md
          git add e2e-rebase-conflict.md
          git commit -m "test(commit-push): base diverges"
          git push origin "${base_branch}"

      - name: Run action with strict rebase conflict handling
        if: ${{ inputs.mode == 'ref' }}
        id: strict
        continue-on-error: true
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: test/e2e-commit-push-conflict-target-${{ github.run_id }}
          base_branch: test/e2e-commit-push-conflict-base-${{ github.run_id }}
          fail_on_rebase_conflict: "true"

      - name: Conflict via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify strict mode failure
        if: ${{ inputs.mode == 'ref' }}
        run: test "${{ steps.strict.outcome }}" = "failure"

      - name: Cleanup - delete test branches
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          for branch in \
            test/e2e-commit-push-conflict-target-${{ github.run_id }} \
            test/e2e-commit-push-conflict-base-${{ github.run_id }}
          do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

  amend-commit:
    name: Amend previous commit with force-with-lease
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create initial branch with commit
        if: ${{ inputs.mode == 'ref' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b test/e2e-commit-push-amend-${{ github.run_id }}
          echo "v1" > e2e-amend-test.md
          git add e2e-amend-test.md
          git commit -m "test(commit-push): initial commit for amend test"
          git push origin test/e2e-commit-push-amend-${{ github.run_id }}

      - name: Add more content to file
        if: ${{ inputs.mode == 'ref' }}
        run: echo "v2" >> e2e-amend-test.md

      - name: Amend commit keeping original message
        if: ${{ inputs.mode == 'ref' }}
        id: amend
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          amend: "true"
          no_edit: "true"
          force_with_lease: "true"

      - name: Amend via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify branch output
        if: ${{ inputs.mode == 'ref' }}
        run: |
          echo "branch_name=${{ steps.amend.outputs.branch_name }}"
          test -n "${{ steps.amend.outputs.branch_name }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-amend-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  gpg-signed-commit:
    name: GPG-signed commit
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate GPG signing material
        if: ${{ inputs.mode == 'ref' }}
        id: gpg
        run: |
          set -euo pipefail
          gpg_batch_file="${RUNNER_TEMP}/gpg-batch"
          gpg_private_file="${RUNNER_TEMP}/gpg-private.asc"
          gpg_public_file="${RUNNER_TEMP}/gpg-public.asc"
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          cat > "${gpg_batch_file}" <<EOF
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: Triglav E2E
          Name-Email: ${{ github.actor }}@users.noreply.github.com
          Passphrase: triglav-passphrase
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --generate-key "${gpg_batch_file}"
          gpg --batch --pinentry-mode loopback --passphrase triglav-passphrase --armor --export-secret-keys "${{ github.actor }}@users.noreply.github.com" > "${gpg_private_file}"
          gpg --armor --export "${{ github.actor }}@users.noreply.github.com" > "${gpg_public_file}"
          {
            echo "secret_key<<EOF"
            cat "${gpg_private_file}"
            echo "EOF"
            echo "public_key<<EOF"
            cat "${gpg_public_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create test file
        run: echo "E2E gpg signing test $(date -u)" > e2e-gpg-signing.md

      - name: Build action image from source
        if: ${{ inputs.mode == 'ref' }}
        run: |
          set -euo pipefail
          action_src="${RUNNER_TEMP}/action-commit-push-src"
          rm -rf "${action_src}"
          git clone --depth 1 --branch master https://github.com/devops-infra/action-commit-push "${action_src}"
          docker build -t triglav-action-commit-push:test "${action_src}"

      - name: Commit and push signed changes with GPG
        if: ${{ inputs.mode == 'ref' }}
        env:
          INPUT_SIGNING_KEY: ${{ steps.gpg.outputs.secret_key }}
          INPUT_SIGNING_PASSPHRASE: triglav-passphrase
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/gpg-action-output.txt"
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -v "${RUNNER_TEMP}:/github/runner_temp" \
            -w /github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_ACTOR="${{ github.actor }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_OUTPUT=/github/runner_temp/gpg-action-output.txt \
            -e INPUT_ORGANIZATION_DOMAIN=github.com \
            -e INPUT_COMMIT_MESSAGE="test(commit-push): gpg signed commit" \
            -e INPUT_TARGET_BRANCH="test/e2e-commit-push-gpg-${{ github.run_id }}" \
            -e INPUT_SIGNING_MODE=gpg \
            -e INPUT_SIGNING_KEY \
            -e INPUT_SIGNING_PASSPHRASE \
            triglav-action-commit-push:test

      - name: GPG signing via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify GPG commit signature
        if: ${{ inputs.mode == 'ref' }}
        run: |
          set -euo pipefail
          gpg_public_file="${RUNNER_TEMP}/gpg-public-verify.asc"
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          printf '%s\n' "${{ steps.gpg.outputs.public_key }}" > "${gpg_public_file}"
          gpg --import "${gpg_public_file}" >/dev/null 2>&1
          git fetch origin "test/e2e-commit-push-gpg-${{ github.run_id }}"
          git verify-commit "origin/test/e2e-commit-push-gpg-${{ github.run_id }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-gpg-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi

  ssh-signed-commit:
    name: SSH-signed commit
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate SSH signing material
        if: ${{ inputs.mode == 'ref' }}
        id: ssh
        run: |
          set -euo pipefail
          ssh_private_key="${RUNNER_TEMP}/ssh-signing-key"
          ssh_public_key="${RUNNER_TEMP}/ssh-signing-key.pub"
          rm -f "${ssh_private_key}" "${ssh_public_key}"
          ssh-keygen -q -t ed25519 -N '' -C "${{ github.actor }}@users.noreply.github.com" -f "${ssh_private_key}"
          {
            echo "private_key<<EOF"
            cat "${ssh_private_key}"
            echo "EOF"
            echo "public_key<<EOF"
            cat "${ssh_public_key}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create test file
        run: echo "E2E ssh signing test $(date -u)" > e2e-ssh-signing.md

      - name: Build action image from source
        if: ${{ inputs.mode == 'ref' }}
        run: |
          set -euo pipefail
          action_src="${RUNNER_TEMP}/action-commit-push-src"
          rm -rf "${action_src}"
          git clone --depth 1 --branch master https://github.com/devops-infra/action-commit-push "${action_src}"
          docker build -t triglav-action-commit-push:test "${action_src}"

      - name: Commit and push signed changes with SSH
        if: ${{ inputs.mode == 'ref' }}
        env:
          INPUT_SIGNING_KEY: ${{ steps.ssh.outputs.private_key }}
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/ssh-action-output.txt"
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -v "${RUNNER_TEMP}:/github/runner_temp" \
            -w /github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_ACTOR="${{ github.actor }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_OUTPUT=/github/runner_temp/ssh-action-output.txt \
            -e INPUT_ORGANIZATION_DOMAIN=github.com \
            -e INPUT_COMMIT_MESSAGE="test(commit-push): ssh signed commit" \
            -e INPUT_TARGET_BRANCH="test/e2e-commit-push-ssh-${{ github.run_id }}" \
            -e INPUT_SIGNING_MODE=ssh \
            -e INPUT_SIGNING_KEY \
            triglav-action-commit-push:test

      - name: SSH signing via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          echo "Image mode placeholder for devopsinfra/action-commit-push:${{ inputs.image_tag }}"
          echo "Use ref mode for authoritative validation until image-mode harness is finalized."

      - name: Verify SSH commit signature
        if: ${{ inputs.mode == 'ref' }}
        run: |
          set -euo pipefail
          allowed_signers_file="${RUNNER_TEMP}/allowed_signers"
          printf '%s %s\n' "${{ github.actor }}@users.noreply.github.com" "${{ steps.ssh.outputs.public_key }}" > "${allowed_signers_file}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${allowed_signers_file}"
          git fetch origin "test/e2e-commit-push-ssh-${{ github.run_id }}"
          git verify-commit "origin/test/e2e-commit-push-ssh-${{ github.run_id }}"

      - name: Cleanup - delete test branch
        if: ${{ always() && inputs.mode == 'ref' }}
        run: |
          branch="test/e2e-commit-push-ssh-${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi
