name: (T) Action Terraform Validate

on:
  workflow_call:
    inputs:
      mode:
        description: Execution mode (ref or image)
        required: false
        type: string
        default: ref
      image_tag:
        description: Image tag for docker mode (for example v1.2.3-test or v1.2.3-rc)
        required: false
        type: string
        default: v1
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (ref or image)
        required: false
        default: ref
        type: choice
        options:
          - ref
          - image
      image_tag:
        description: Image tag for docker mode (for example v1.2.3-test or v1.2.3-rc)
        required: false
        default: v1
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate workflow inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate mode input
        run: |
          case "${{ inputs.mode }}" in
            ref|image) ;;
            *)
              echo "Unsupported mode '${{ inputs.mode }}'. Expected 'ref' or 'image'."
              exit 1
              ;;
          esac

      - name: Enforce organization caller for reusable workflow
        if: ${{ github.event_name == 'workflow_call' }}
        run: |
          if [ "${{ github.repository_owner }}" != "devops-infra" ]; then
            echo "This reusable workflow can only be called by devops-infra repositories."
            exit 1
          fi

  validate-basic:
    name: Validate valid Terraform configuration
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create valid Terraform module
        run: |
          mkdir -p terraform/module_validate
          cat > terraform/module_validate/main.tf << 'EOF'
          variable "name" {
            description = "Resource name"
            type        = string
          }

          variable "env" {
            description = "Deployment environment"
            type        = string
            default     = "dev"
          }

          locals {
            full_name = "${var.name}-${var.env}"
          }

          output "full_name" {
            value = local.full_name
          }
          EOF

      - name: Validate all Terraform modules
        if: ${{ inputs.mode == 'ref' }}
        uses: devops-infra/action-terraform-validate@v1
        with:
          dir_filter: terraform

      - name: Validate via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        env:
          ACTION_IMAGE: devopsinfra/action-terraform-validate:${{ inputs.image_tag }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          docker pull "${ACTION_IMAGE}"
          docker run --rm \
            -e INPUT_DIR_FILTER=terraform \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            "${ACTION_IMAGE}"

  validate-with-dir-filter:
    name: Validate with explicit directory filter
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create multiple Terraform modules
        run: |
          mkdir -p terraform/module_a terraform/module_b

          cat > terraform/module_a/main.tf << 'EOF'
          variable "name" {
            description = "Name of the resource"
            type        = string
          }

          output "name_upper" {
            value = upper(var.name)
          }
          EOF

          cat > terraform/module_b/main.tf << 'EOF'
          variable "count_value" {
            description = "Number of instances"
            type        = number
            default     = 1
          }

          output "count_doubled" {
            value = var.count_value * 2
          }
          EOF

      - name: Validate only module_a
        if: ${{ inputs.mode == 'ref' }}
        uses: devops-infra/action-terraform-validate@v1
        with:
          dir_filter: terraform/module_a

      - name: Validate via docker image (preview)
        if: ${{ inputs.mode == 'image' }}
        env:
          ACTION_IMAGE: devopsinfra/action-terraform-validate:${{ inputs.image_tag }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required when mode=image"
            exit 1
          fi
          docker pull "${ACTION_IMAGE}"
          docker run --rm \
            -e INPUT_DIR_FILTER=terraform/module_a \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            "${ACTION_IMAGE}"
